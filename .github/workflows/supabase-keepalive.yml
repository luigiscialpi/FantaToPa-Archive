name: Supabase keepalive

on:
  schedule:
    - cron: '0 6 */3 * *'   # ogni 3 giorni, ben sotto il limite di 7
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query leggera per evitare la pausa del progetto free
        # Risposta vuota attesa: la RLS blocca la lettura anonima (sezione 9,
        # archivio riservato). Basta che la richiesta arrivi al DB — non serve
        # che torni un dato reale, l'importante è generare attività.
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/seasons?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
